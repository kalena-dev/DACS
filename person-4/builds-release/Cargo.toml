[package]
name = "dacs-release-audit"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"

[[bin]]
name = "dacs-build-preflight"
path = "preflight.rs"

[[bin]]
name = "dacs-rustc-provenance"
path = "src/rustc_provenance.rs"

[lints]
workspace = true

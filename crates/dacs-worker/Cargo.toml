[package]
name = "dacs-worker"
description = "Durable local worker runtime and OMP JSONL RPC adapter. Owner: Person 2."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
dacs-protocol.workspace = true
dacs-release-audit = { path = "../../person-4/builds-release" }
reqwest.workspace = true
base64.workspace = true
fs2 = "0.4"
process-wrap = { version = "10.0.1", features = ["tokio1"] }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
axum.workspace = true
hex.workspace = true
rusqlite.workspace = true
redb = "2"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal", "process"] }

[dev-dependencies]
# Real coordinator state machine behind an HTTP shim in tests/obligations.rs.
dacs-core.workspace = true
tempfile.workspace = true
# TLS mock coordinator for tests/leases.rs (the worker's real HTTPS client).
axum-server.workspace = true
rcgen = "0.13"
rustls.workspace = true

[target.'cfg(all(windows, target_env = "msvc"))'.dev-dependencies]
find-msvc-tools = "0.1.15"

[lints]
workspace = true

# Workspace manifest. Owner: Person 1 (coordinator/contracts/integration).
# Other tracks: send dependency requests to Person 1; do not edit this file or Cargo.lock.
[workspace]
resolver = "3"
members = [
    "crates/dacs-protocol",    # P1: shared contract
    "crates/dacs-coordinator", # P1: coordinator process
    "crates/dacs-worker",      # P2: worker execution + OMP adapter
    "crates/dacs-net",         # P3: networking/enrollment adapters + build execution
    "crates/dacs-console",     # P4: UI/setup + dependency planning
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
dacs-protocol = { path = "crates/dacs-protocol" }
dacs-net = { path = "crates/dacs-net" }
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
http-body-util = "0.1"
# Plain HTTP client: transport encryption is provided by the tailnet (WireGuard);
# avoids aws-lc/OpenSSL build requirements on Windows.
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream"] }
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace]
members = ["crates/dacs-protocol", "crates/dacs-core", "crates/dacs-source", "crates/dacs-setup", "crates/dacs-ui", "crates/dacs-app", "crates/dacs-worker", "person-4/builds-release"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false

[workspace.dependencies]
dacs-protocol = { path = "crates/dacs-protocol" }
dacs-core = { path = "crates/dacs-core" }
dacs-source = { path = "crates/dacs-source" }
dacs-setup = { path = "crates/dacs-setup" }
dacs-ui = { path = "crates/dacs-ui" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros", "multipart"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "stream"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
tower-http = { version = "0.6", features = ["fs", "trace", "limit", "cors"] }
leptos = { version = "0.8", features = ["ssr"] }
url = "2"
semver = { version = "1", features = ["serde"] }
ed25519-dalek = "2"
base64 = "0.22"

[profile.release]
lto = "thin"
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"

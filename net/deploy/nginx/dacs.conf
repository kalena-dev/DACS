# DACS public edge on the infrastructure host. Include from nginx.conf at the
# top level (not inside http {}): `include /etc/nginx/dacs.conf;`
# Requires nginx with the stream and stream_ssl_preread modules
# (Debian/Ubuntu: package `libnginx-mod-stream`).
#
# Placeholders: HS_DOMAIN, BOOTSTRAP_DOMAIN, COORDINATOR_OVERLAY_IP.
#
#   HS_DOMAIN        -> Headscale control + embedded DERP (TLS terminated here)
#   BOOTSTRAP_DOMAIN -> TLS passthrough to the coordinator bootstrap API over
#                       the overlay; the coordinator terminates TLS itself, so
#                       this host never sees bootstrap plaintext.
#
# dacs-netadmin is NOT exposed here; it listens on the infra host's overlay IP.

stream {
    map $ssl_preread_server_name $dacs_upstream {
        HS_DOMAIN         headscale_tls;
        BOOTSTRAP_DOMAIN  coordinator_bootstrap;
        default           reject;
    }

    upstream headscale_tls {
        server 127.0.0.1:8443;
    }

    upstream coordinator_bootstrap {
        # Coordinator's overlay address (tag:dacs-coordinator), port 7444.
        server COORDINATOR_OVERLAY_IP:7444;
    }

    upstream reject {
        server 127.0.0.1:9;
    }

    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_connect_timeout 5s;
        proxy_pass $dacs_upstream;
    }
}

http {
    map $http_upgrade $connection_upgrade {
        default keep-alive;
        ''      close;
    }

    upstream headscale {
        server 127.0.0.1:8080 max_fails=1 fail_timeout=5s;
        keepalive 2;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name HS_DOMAIN BOOTSTRAP_DOMAIN;

        # ACME HTTP-01 (certbot --webroot -w /var/www/certbot).
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        # Tailscale captive portal detection.
        location = /generate_204 {
            return 204;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Headscale behind the stream router (from Headscale's reverse-proxy docs).
    server {
        listen 127.0.0.1:8443 ssl;
        http2 on;
        server_name HS_DOMAIN;

        ssl_certificate     /etc/letsencrypt/live/HS_DOMAIN/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/HS_DOMAIN/privkey.pem;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_pass http://headscale;
        }
    }
}

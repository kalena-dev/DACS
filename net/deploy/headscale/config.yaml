# DACS Headscale configuration, derived from juanfont/headscale v0.29.7
# config-example.yaml. Placeholders: HS_DOMAIN (public control/DERP name),
# PUBLIC_IPV4 / PUBLIC_IPV6 (infrastructure host addresses).
#
# Headscale listens on loopback; nginx (deploy/nginx/dacs.conf) terminates
# public TLS and proxies the Tailscale control protocol and embedded DERP.
---
server_url: https://HS_DOMAIN
listen_addr: 127.0.0.1:8080
metrics_listen_addr: 127.0.0.1:9090
grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: false
trusted_proxies:
  - 127.0.0.1/32
  - ::1/128

noise:
  private_key_path: /var/lib/headscale/noise_private.key

# dacs-net-contract::is_overlay_ip assumes these prefixes.
prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

# Self-hosted relay only: the embedded DERP server, no Tailscale-operated
# DERP map. STUN (udp/3478) must be reachable publicly.
derp:
  server:
    enabled: true
    region_id: 999
    region_code: "dacs"
    region_name: "DACS self-hosted DERP"
    verify_clients: true
    stun_listen_addr: "0.0.0.0:3478"
    private_key_path: /var/lib/headscale/derp_server_private.key
    automatically_add_embedded_derp_region: true
    ipv4: PUBLIC_IPV4
    ipv6: PUBLIC_IPV6
  urls: []
  paths: []
  auto_update_enabled: false
  update_frequency: 3h

disable_check_updates: true

node:
  # Nodes do not expire on a timer; DACS revokes them explicitly.
  expiry: 0
  ephemeral:
    inactivity_timeout: 30m

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true
    wal_autocheckpoint: 1000

# TLS is terminated by nginx.
tls_cert_path: ""
tls_key_path: ""

log:
  level: info
  format: text

policy:
  mode: file
  path: /etc/headscale/policy.hujson

# MagicDNS names under dacs.internal without overriding the hosts' own DNS
# resolvers (teammates' PCs keep their normal DNS).
dns:
  magic_dns: true
  base_domain: dacs.internal
  override_local_dns: false
  nameservers:
    global: []
    split: {}
  search_domains: []
  extra_records: []

unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"

logtail:
  enabled: false

taildrop:
  enabled: false

# Person 3 (network and enrollment) workspace.
#
# Person 1 owns the DACS root workspace manifest and lockfile. Until the root
# workspace exists, these crates build here; integration adds them as members
# of the root workspace and removes this file.
[workspace]
resolver = "3"
members = [
    "crates/dacs-net-contract",
    "crates/dacs-netclient",
    "crates/dacs-netadmin",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
dacs-net-contract = { path = "crates/dacs-net-contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "net", "time", "fs", "io-util", "signal"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
subtle = "2"
tempfile = "3"

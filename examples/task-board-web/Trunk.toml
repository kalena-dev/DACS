# Requirements: Rust >= 1.89, rustup target add wasm32-unknown-unknown, Trunk.
# From this directory: trunk build --release
# Serve the resulting ./dist directory with dacs task-board --assets <absolute-dist>.
# No Node/npm, SSR, hydration, or development proxy is required.
[build]
target = "index.html"
dist = "dist"
public_url = "/"
filehash = true

[watch]
ignore = ["dist"]

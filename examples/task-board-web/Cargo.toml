[package]
name = "dacs-task-board-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
form_urlencoded = "1.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The workspace Leptos dependency enables SSR; this frontend is CSR only.
leptos = { version = "0.8", default-features = false, features = ["csr"] }
gloo-net = { version = "0.6", default-features = false, features = ["http"] }

[lints]
workspace = true
